{% extends "base.html" %}

{% block title %}Confirmar Eliminación{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow">
    <h1 class="text-2xl font-bold text-red-600 mb-4">⚠️ Confirmar Eliminación</h1>
    <p class="text-gray-700 mb-4">
        ¿Estás seguro de eliminar al usuario <strong>{{ usuario.get_full_name }}</strong> ({{ usuario.username }})?
    </p>
    <p class="text-sm text-gray-500 mb-6">Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <div class="flex justify-end space-x-4">
            <a href="{% url 'usuarios:lista' %}" class="px-4 py-2 bg-gray-300 rounded">Cancelar</a>
            <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded">
                Sí, eliminar
            </button>
        </div>
    </form>
</div>
{% endblock %}
